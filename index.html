<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0E1016">
  <title>root_18day</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-lockup">
        <div class="brand-mark">R</div>
        <div>
          <strong id="courseEyebrow">root_18day</strong>
          <span id="todayTitle">DAY 01</span>
        </div>
      </div>
      <button id="adminToggle" class="icon-button" type="button" aria-label="관리자 화면 열기">ADMIN</button>
    </header>

    <section id="learnerHome" class="screen simple-home">
      <section class="home-focus-card">
        <span id="statusChip" class="status-chip">READY</span>
        <h1 class="home-day"><span>DAY</span><b id="homeDayNumber">01</b></h1>
        <p id="goalAmount" class="home-count">ROOT 16 · 93 WORDS</p>
        <button id="startButton" class="primary home-start-button" type="button">START</button>
        <div class="home-progress-compact">
          <div class="home-progress-head">
            <span id="blockStatus">0 / 4</span>
          </div>
          <div id="blockList" class="segment-track compact-segments" aria-label="오늘의 네 학습 구간"></div>
        </div>
      </section>
      <section id="resumeNotice" class="notice hidden" aria-live="polite"></section>
    </section>

    <section id="sessionScreen" class="screen hidden" aria-live="polite">
      <div class="session-head">
        <button id="exitSession" class="ghost compact-button" type="button">PAUSE</button>
        <div class="session-progress-wrap">
          <div class="session-labels"><span id="sessionBlockLabel">DAY 01</span><span id="sessionProgressText">0 / 0</span></div>
          <div class="progress-track"><div id="sessionProgressBar" class="progress-bar"></div></div>
        </div>
      </div>

      <section id="learningCard" class="learning-card">
        <div id="stageBadge" class="stage-badge visually-hidden">TEST</div>
        <div id="learningContent"></div>
        <div id="answerArea" class="answer-area"></div>
        <div id="feedback" class="feedback hidden" role="status"></div>
      </section>
    </section>

    <section id="completionScreen" class="screen hidden">
      <section class="completion-card">
        <span class="completion-mark">✓</span>
        <h2 id="completionTitle">DAY 01</h2>
        <div id="completionMetrics" class="metric-grid"></div>
        <p id="mailStatus" class="mail-status"></p>
        <button id="completionConfirm" class="primary large" type="button">OK</button>
      </section>
    </section>

    <section id="adminView" class="screen hidden">
      <section class="admin-card">
        <div class="section-head">
          <h2>ADMIN</h2>
          <button id="closeAdmin" class="ghost compact-button" type="button">CLOSE</button>
        </div>

        <div class="admin-grid">
          <label>DAY<select id="daySelect"></select></label>
          <label>BLOCK<select id="blockMinutes"><option value="12">12 MIN</option><option value="15" selected>15 MIN</option><option value="18">18 MIN</option></select></label>
          <label>START<span class="time-input-wrap"><input id="startTime" type="time" value="19:30"></span></label>
          <label>END<span class="time-input-wrap"><input id="endTime" type="time" value="20:30"></span></label>
          <label class="full">EMAIL<input id="reportEmail" type="email" value="sk01197375068@gmail.com" autocomplete="email"></label>
        </div>

        <input id="autoMail" class="hidden" type="checkbox" checked>
        <div class="mail-required-admin"><strong>MAIL REQUIRED</strong></div>
        <label class="check-row"><input id="shortenMastered" type="checkbox" checked> FAST PASS</label>

        <div class="button-row">
          <button id="saveAdmin" class="primary" type="button">SAVE</button>
          <button id="retryMail" class="ghost" type="button">RETRY MAIL</button>
          <button id="exportProgress" class="ghost" type="button">BACKUP</button>
          <button id="importProgress" class="ghost" type="button">RESTORE</button>
          <button id="selfCheck" class="ghost" type="button">CHECK</button>
          <input id="importProgressFile" class="hidden" type="file" accept="application/json,.json">
          <button id="forceComplete" class="danger" type="button">FORCE COMPLETE</button>
        </div>

        <section class="admin-summary">
          <h3 id="adminCourseTitle">18DAY</h3>
          <div id="spellingBacklogSummary" class="admin-backlog" aria-live="polite"></div>
          <div id="reviewSystemSummary" class="admin-system-grid" aria-live="polite"></div>
          <div id="storageSystemSummary" class="admin-storage-status" aria-live="polite"></div>
          <div id="adminProgressList" class="admin-progress-list"></div>
        </section>
      </section>
    </section>
  </main>

  <section id="mailGateModal" class="mail-gate-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="mailGateTitle">
    <div class="mail-gate-card" tabindex="-1">
      <p class="mail-gate-kicker">REQUIRED</p>
      <h2 id="mailGateTitle">SEND DAY REPORT</h2>
      <div id="mailGateMetrics" class="mail-gate-metrics"></div>
      <p class="mail-gate-destination"><strong id="mailGateEmail">sk01197375068@gmail.com</strong></p>
      <p id="mailGateStatus" class="mail-gate-status" aria-live="assertive"></p>
      <button id="sendCompletionMail" class="mail-send-button" type="button">SEND REPORT</button>
    </div>
  </section>

  <template id="optionTemplate"><button class="option-button" type="button"></button></template>
  <script src="app.js"></script>
</body>
</html>
